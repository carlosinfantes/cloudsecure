name: CI

on:
  push:
    branches: [dev, main]
  pull_request:

jobs:
  python:
    name: Python tests & lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install ruff==0.4.9
          pip install -e ".[dev]"
        working-directory: lambdas

      - name: Ruff lint
        run: ruff check .
        working-directory: lambdas

      - name: Black format check
        run: black --check .
        working-directory: lambdas

      - name: Run tests
        run: python -m pytest tests/ -v
        working-directory: lambdas

  cli:
    name: CLI tests
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # The lowest version we claim to support, and the newest we test on
        python-version: ["3.10", "3.13"]
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install CLI
        run: pip install -e ".[dev]"
        working-directory: cli

      - name: Run tests
        run: python -m pytest tests/ -v
        working-directory: cli
        env:
          # Unit tests must never reach AWS
          AWS_CONFIG_FILE: /dev/null
          AWS_SHARED_CREDENTIALS_FILE: /dev/null

      - name: CLI starts
        run: cloudsecure --version

  cdk:
    name: CDK build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: "24"

      - name: Install dependencies
        run: npm ci
        working-directory: infrastructure

      - name: Build TypeScript
        run: npm run build
        working-directory: infrastructure

      - name: Run tests
        run: npm test
        working-directory: infrastructure

      - name: Synthesize CloudFormation
        # Catches wiring errors that compiling alone does not. No AWS
        # credentials needed: the app has no environment lookups.
        run: npx cdk synth --all -c skipProwler=true --quiet
        working-directory: infrastructure
